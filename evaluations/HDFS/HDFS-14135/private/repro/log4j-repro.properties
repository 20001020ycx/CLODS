# Verbose DEBUG logging for the reproduction run, formatted like a production HDFS log
# (same layout as production-logs/HDFS/production.log) so the reproduction and the
# production noise read as one collection after the M3 merge.
log4j.rootLogger=DEBUG,stdout
log4j.threshold=ALL
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{ISO8601} %-5p %c: %m%n
